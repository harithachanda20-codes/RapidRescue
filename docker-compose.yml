services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rapidrescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [rapidrescue_pg:/var/lib/postgresql/data]
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rapidrescue
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-development-secret-key-at-least-32-chars
      FRONTEND_URL: http://localhost
    depends_on: [postgres]
    ports: ["8080:8080"]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  rapidrescue_pg:
